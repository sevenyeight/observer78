<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Observer HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #050505; color: #00ff41; }
        .hud-border { border: 1px solid #00ff41; box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }
        .scanline { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; }
        .breath-circle { transition: transform 4s linear; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">
    <div class="scanline fixed inset-0 z-50"></div>

    <header class="p-4 border-b border-green-900 flex justify-between items-center text-xs">
        <div>ID: OBSERVER_01</div>
        <div id="clock">00:00:00</div>
        <div class="text-green-700">STATUS: ACTIVE</div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 space-y-6">
        
        <section id="dispatch-card" class="hud-border bg-black p-4 rounded-sm space-y-3">
            <div class="flex justify-between items-center border-b border-green-900 pb-2">
                <h2 class="text-sm font-bold tracking-widest uppercase">Current Mission</h2>
                <button onclick="generateMission()" class="text-[10px] bg-green-900 px-2 py-1 hover:bg-green-700 active:scale-95">RECALIBRATE</button>
            </div>
            <p id="mission-text" class="text-lg leading-tight italic">Initializing feed...</p>
        </section>

        <section class="hud-border bg-black p-4 rounded-sm space-y-4">
            <h2 class="text-sm font-bold tracking-widest uppercase border-b border-green-900 pb-2">Internal Maintenance</h2>
            <div class="flex flex-col items-center py-4 space-y-4">
                <div id="breath-node" class="w-24 h-24 rounded-full border-2 border-green-500 flex items-center justify-center relative">
                    <div id="breath-label" class="text-[10px] uppercase">Ready</div>
                </div>
                <button onclick="startBreathing()" class="w-full py-2 border border-green-500 text-xs hover:bg-green-900 transition">START RESPIRATION CALIBRATION</button>
            </div>
            <div class="p-2 bg-green-900/10 border-l-2 border-green-500 italic text-sm">
                "I am a guest in this space, not the creator of it."
            </div>
        </section>

        <section class="hud-border bg-black p-4 rounded-sm space-y-3">
            <h2 class="text-sm font-bold tracking-widest uppercase border-b border-green-900 pb-2">Field Logs</h2>
            <textarea id="log-input" placeholder="Enter observation data..." class="w-full bg-black border border-green-900 p-2 text-green-400 focus:outline-none focus:border-green-500 h-24 text-sm"></textarea>
            <button onclick="saveLog()" class="w-full py-2 bg-green-600 text-black font-bold text-xs uppercase hover:bg-green-400">Commit to Archive</button>
            <div id="log-history" class="space-y-2 mt-4 max-h-40 overflow-y-auto"></div>
        </section>

    </main>

    <footer class="p-4 border-t border-green-900 text-[10px] text-green-700 flex justify-center uppercase tracking-widest">
        &copy; The Observer Field Kit v1.0
    </footer>

    <script>
        const missions = [
            "Document 3 objects colder than your skin. [cite: 3]",
            "Audit the 'Independent Agenda' of a stranger: what mundane task are they finishing? [cite: 3]",
            "Document a natural movement you did NOT cause (wind, ripples). [cite: 3]",
            "Identify an item of clothing a stranger likely regrets buying. ",
            "Check structural integrity: describe the geometry of the nearest bench or pier. ",
            "Mechanical Stubbornness Test: Feel the vibration of your scooter or weight of your bag. [cite: 3]",
            "Cast a line and ask: 'Will you respond to me?' Record the 'ping'. "
        ];

        const generateMission = () => {
            const index = Math.floor(Math.random() * missions.length);
            document.getElementById('mission-text').innerText = missions[index];
        };

        const startBreathing = () => {
            const node = document.getElementById('breath-node');
            const label = document.getElementById('breath-label');
            let cycle = 0;
            const phases = [
                { text: 'Inhale', scale: 'scale-150', time: 4000 },
                { text: 'Hold', scale: 'scale-150', time: 4000 },
                { text: 'Exhale', scale: 'scale-100', time: 4000 },
                { text: 'Hold', scale: 'scale-100', time: 4000 }
            ];

            const runPhase = () => {
                const phase = phases[cycle % 4];
                label.innerText = phase.text;
                node.style.transform = phase.scale.replace('scale-', 'scale(').replace('150', '1.5').replace('100', '1') + ')';
                cycle++;
                setTimeout(runPhase, 4000);
            };
            runPhase();
        };

        const saveLog = () => {
            const text = document.getElementById('log-input').value;
            if (!text) return;
            const log = { text, date: new Date().toLocaleTimeString() };
            const history = JSON.parse(localStorage.getItem('observer_logs') || '[]');
            history.unshift(log);
            localStorage.setItem('observer_logs', JSON.stringify(history));
            document.getElementById('log-input').value = '';
            renderLogs();
        };

        const renderLogs = () => {
            const history = JSON.parse(localStorage.getItem('observer_logs') || '[]');
            const container = document.getElementById('log-history');
            container.innerHTML = history.map(l => `
                <div class="border-l border-green-800 pl-2 py-1">
                    <span class="text-[8px] text-green-700 uppercase">${l.date}</span>
                    <p class="text-xs text-green-300">${l.text}</p>
                </div>
            `).join('');
        };

        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        window.onload = () => {
            generateMission();
            renderLogs();
        };
    </script>
</body>
</html>
